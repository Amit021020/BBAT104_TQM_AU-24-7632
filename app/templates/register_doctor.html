
{% extends "base.html" %}

{% block title %}Register Doctor | MediCare HMS{% endblock %}
{% block page_heading %}Register Doctor{% endblock %}

{% block content %}

<div class="dashboard-card">

    <div class="card-heading">
        <div>
            <h5>New Doctor Registration</h5>
            <p>Enter the doctor's professional information.</p>
        </div>
    </div>

    <form method="POST"
          action="{{ url_for('register_doctor') }}">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Specialization</label>
                <input type="text"
                       name="specialization"
                       class="form-control"
                       placeholder="e.g. Cardiology"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Department</label>
                <input type="text"
                       name="department"
                       class="form-control"
                       placeholder="e.g. Cardiology Department"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="tel"
                       name="phone"
                       class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control">
            </div>

        </div>

        <div class="d-flex gap-2 mt-4">

            <button type="submit"
                    class="btn btn-primary">
                <i class="bi bi-check-circle"></i>
                Register Doctor
            </button>

            <a href="{{ url_for('doctors') }}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
