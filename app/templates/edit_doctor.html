
{% extends "base.html" %}

{% block title %}Edit Doctor | MediCare HMS{% endblock %}
{% block page_heading %}Edit Doctor{% endblock %}

{% block content %}

<div class="dashboard-card">

    <div class="card-heading">
        <div>
            <h5>Edit Doctor</h5>
            <p>{{ doctor.doctor_code }}</p>
        </div>
    </div>

    <form method="POST"
          action="{{ url_for('edit_doctor', doctor_id=doctor.id) }}">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ doctor.name }}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Specialization</label>
                <input type="text"
                       name="specialization"
                       class="form-control"
                       value="{{ doctor.specialization }}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Department</label>
                <input type="text"
                       name="department"
                       class="form-control"
                       value="{{ doctor.department }}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="tel"
                       name="phone"
                       class="form-control"
                       value="{{ doctor.phone or '' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ doctor.email or '' }}">
            </div>

        </div>

        <div class="d-flex gap-2 mt-4">

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i>
                Save Changes
            </button>

            <a href="{{ url_for('view_doctor', doctor_id=doctor.id) }}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
