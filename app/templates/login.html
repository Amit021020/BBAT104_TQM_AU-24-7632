
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hospital Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-card {
            width: 350px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h2 {
            color: #0f172a;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Hospital Management</h2>
    <p>Sign in to continue</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Username</label>
        <input type="text"
               name="username"
               required
               autocomplete="username">

        <label>Password</label>
        <input type="password"
               name="password"
               required
               autocomplete="current-password">

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
